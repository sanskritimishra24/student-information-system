<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | StudentHub</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><nav class="navbar container">
<a class="brand" href="index.html">Student<span>Hub</span></a><button class="menu-btn" aria-label="Toggle menu">☰</button>
<ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="index.html#students">Students</a></li><li><a href="index.html#skills">Skills</a></li><li><a class="active" href="contact.html">Contact</a></li></ul>
</nav></header>
<main class="section container narrow">
<div class="section-heading"><div><p class="eyebrow">GET IN TOUCH</p><h1>Contact Form</h1></div></div>
<form id="contactForm" class="contact-form" novalidate>
<label for="name">Full Name</label><input id="name" name="name" type="text" placeholder="Enter your name">
<small class="error" id="nameError"></small>
<label for="email">Email Address</label><input id="email" name="email" type="email" placeholder="you@example.com">
<small class="error" id="emailError"></small>
<label for="subject">Subject</label><input id="subject" name="subject" type="text" placeholder="What is your message about?">
<small class="error" id="subjectError"></small>
<label for="message">Message</label><textarea id="message" name="message" rows="6" placeholder="Write your message..."></textarea>
<small class="error" id="messageError"></small>
<button class="btn primary" type="submit">Send Message</button>
<p id="formSuccess" class="success"></p>
</form>
</main>
<footer class="footer"><div class="container footer-inner"><p>© 2026 StudentHub.</p><a href="index.html">Back to Home</a></div></footer>
<script src="js/script.js"></script>
</body>
</html>
